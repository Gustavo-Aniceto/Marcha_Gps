<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <radialGradient id="bg" cx="50%" cy="32%" r="78%">
      <stop offset="0" stop-color="#232830"/>
      <stop offset="0.55" stop-color="#111317"/>
      <stop offset="1" stop-color="#060708"/>
    </radialGradient>
    <linearGradient id="lime" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E4FF8A"/>
      <stop offset="0.5" stop-color="#C9EE62"/>
      <stop offset="1" stop-color="#8DBA2A"/>
    </linearGradient>
    <linearGradient id="pin" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#D6E6FF"/>
      <stop offset="0.45" stop-color="#8FB8F0"/>
      <stop offset="1" stop-color="#4C78B8"/>
    </linearGradient>
    <linearGradient id="slot" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#000" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#1A1D22" stop-opacity="0.9"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="18" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="shadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="18" stdDeviation="16" flood-color="#000" flood-opacity="0.65"/>
    </filter>
    <pattern id="carbon" width="24" height="24" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="12" height="24" fill="#fff" opacity="0.018"/>
    </pattern>
  </defs>
  <rect width="1024" height="1024" fill="url(#bg)"/>
  <rect width="1024" height="1024" fill="url(#carbon)"/><g transform="translate(-33 45)">
  <!-- placa do câmbio: trilho escuro por baixo das linhas -->
  <g stroke="url(#slot)" stroke-width="104" stroke-linecap="round" fill="none">
    <path d="M330 330 V720 M512 330 V720 M694 330 V720 M330 525 H694"/>
  </g>
  <!-- grade do câmbio em verde-limão -->
  <g stroke="url(#lime)" stroke-width="58" stroke-linecap="round" fill="none" filter="url(#glow)">
    <path d="M330 330 V720 M512 330 V720 M694 368 V720 M330 525 H694"/>
  </g>
  
  <!-- manopla = pino do GPS encaixado na 5ª -->
  <g filter="url(#shadow)">
    <path d="M694 392 C 652 330, 600 286, 600 224 A 94 94 0 1 1 788 224 C 788 286, 736 330, 694 392 Z" fill="url(#pin)"/>
    <circle cx="694" cy="222" r="38" fill="#0B0D10"/>
    <circle cx="694" cy="222" r="15" fill="#C9EE62"/>
    <path d="M626 196 A 72 72 0 0 1 690 150" stroke="#fff" stroke-opacity="0.55" stroke-width="12" stroke-linecap="round" fill="none"/>
  </g>
</g></svg>
