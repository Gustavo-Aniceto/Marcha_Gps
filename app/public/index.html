<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
    <title>Marcha GPS</title>
    <meta name="description" content="O GPS da cena rebaixada. Só entra quem é convidado." />
    <meta name="theme-color" content="#070B12" />
    <link rel="manifest" href="/manifest.json" />
    <!-- já abre a conexão com o mapa, o banco e o login enquanto o app carrega -->
    <link rel="preconnect" href="https://tiles.openfreemap.org" crossorigin />
    <link rel="preconnect" href="https://ep-dark-night-b607qc86.apirest.c-2.sa-east-1.aws.neon.tech" crossorigin />
    <link rel="preconnect" href="https://great-aphid-3258.clerk.accounts.dev" crossorigin />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <!-- iPhone: tela inicial em tela cheia -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Marcha GPS" />
    <style>
      html, body, #root { height: 100%; margin: 0; background: #070B12; }
      body { overflow: hidden; overscroll-behavior: none; -webkit-tap-highlight-color: transparent; }
      #root { display: flex; }
    </style>
  </head>
  <body>
    <noscript>Ative o JavaScript pra usar o Marcha GPS.</noscript>
    <div id="root"></div>
    <script>
      // Se algo quebrar antes do app abrir, mostra o motivo em vez de tela preta.
      (function () {
        function show(msg) {
          var el = document.getElementById('erro-app');
          if (!el) {
            el = document.createElement('pre');
            el.id = 'erro-app';
            el.style.cssText = 'position:fixed;left:0;right:0;bottom:0;margin:0;padding:12px;max-height:45%;overflow:auto;' +
              'background:#1c1206;color:#ffb070;font:12px/1.4 monospace;white-space:pre-wrap;z-index:99999';
            document.body.appendChild(el);
          }
          el.textContent = 'Algo deu errado ao abrir o Marcha GPS. Manda um print disso pro suporte:\n\n' + msg + '\n\n' + el.textContent.replace(/^Algo deu errado[\s\S]*?\n\n/, '');
        }
        window.addEventListener('error', function (e) { show(String(e.message) + (e.error && e.error.stack ? '\n' + e.error.stack : '')); });
        window.addEventListener('unhandledrejection', function (e) { var r = e.reason; show('Promise: ' + (r && (r.stack || r.message) || String(r))); });
      })();
    </script>
  </body>
</html>
